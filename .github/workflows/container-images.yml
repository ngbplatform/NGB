name: container-images

on:
  workflow_run:
    workflows: [publish-certified-platform-release, publish-platform-nuget, publish-platform-ui]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: container-images-${{ github.event.workflow_run.display_title || format('Publish NGB {0}', github.sha) }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ngbplatform
  BUILD_CONFIGURATION: Release

jobs:
  release-source:
    name: verify published release before building images
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Select the exact successful publication
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const { selectContainerSource } = require('./.github/scripts/container-source.cjs');
            const source = await selectContainerSource(github, context);
            core.setOutput('sha', source.sha);
            core.setOutput('run-id', source.runId);
            core.setOutput('artifact-id', source.artifactId);
      - name: Checkout the published source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
      - name: Require the published commit to belong to main
        env:
          NGB_RELEASE_COMMIT: ${{ steps.source.outputs.sha }}
        run: git merge-base --is-ancestor "$NGB_RELEASE_COMMIT" origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Download evidence from the selected publication
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.source.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts/release-candidate
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Verify source, package versions and registry evidence
        env:
          NGB_RELEASE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          npm --prefix quality ci
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises'
          import { createRequire } from 'node:module'
          const { assertContainerManifest } = createRequire(import.meta.url)('./.github/scripts/container-source.cjs')
          const manifest = JSON.parse(await readFile('artifacts/release-candidate/release-manifest.json', 'utf8'))
          const props = await readFile('Directory.Build.props', 'utf8')
          const ui = JSON.parse(await readFile('ui/ngb-crm-web/package.json', 'utf8'))
          assertContainerManifest(manifest, process.env.NGB_RELEASE_COMMIT, props, ui)
          JS
          node quality/external-consumer/release.mjs verify-publication
          node quality/external-consumer/release.mjs verify-promotion

  crm-registry-dependencies:
    name: verify CRM registry dependencies
    needs: release-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-source.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ui/ngb-crm-web/package-lock.json

      - name: Check CRM registry package availability
        run: |
          set -euo pipefail

          platform_version="$(sed -nE 's:.*<Version>([^<]+)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          ui_version="$(node -p "require('./ui/ngb-crm-web/package.json').dependencies['@ngbplatform/ui']")"

          if [ -z "${platform_version}" ]; then
            echo "::error::Could not read platform package version from Directory.Build.props."
            exit 1
          fi

          if [ -z "${ui_version}" ]; then
            echo "::error::Could not read @ngbplatform/ui version from ui/ngb-crm-web/package.json."
            exit 1
          fi

          packages=(
            NGB.Platform.Tools
            NGB.Platform.Core
            NGB.Platform.Attachments
            NGB.Platform.Notes
            NGB.Platform.Attachments.MinIO
            NGB.Platform.Contracts
            NGB.Platform.Accounting
            NGB.Platform.Metadata
            NGB.Platform.OperationalRegisters
            NGB.Platform.Application.Abstractions
            NGB.Platform.ReferenceRegisters
            NGB.Platform.Persistence
            NGB.Platform.Definitions
            NGB.Platform.PostgreSql
            NGB.Platform.PostgreSql.AspNetCore
            NGB.Platform.Runtime
            NGB.Platform.Runtime.Hosting
            NGB.Platform.Hosting.AspNetCore
            NGB.Platform.Api
            NGB.Platform.BackgroundJobs
            NGB.Platform.BackgroundJobs.PostgreSql
            NGB.Platform.Migrator.Core
            NGB.Platform.Watchdog
          )

          missing=()

          if ! npm view "@ngbplatform/ui@${ui_version}" version --silent >/dev/null 2>&1; then
            missing+=("@ngbplatform/ui@${ui_version}")
          fi

          for package in "${packages[@]}"; do
            package_path="$(printf '%s' "${package}" | tr '[:upper:]' '[:lower:]')"
            package_url="https://api.nuget.org/v3-flatcontainer/${package_path}/${platform_version}/${package_path}.${platform_version}.nupkg"
            if ! curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 --output /dev/null "${package_url}"; then
              missing+=("${package}@${platform_version}")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            exit 0
          fi

          printf 'Missing CRM registry packages:\n'
          printf ' - %s\n' "${missing[@]}"

          echo "::error::Verified release packages are unavailable. Retry this container run after registry access is restored."
          exit 1

      - name: Restore CRM UI from npm
        working-directory: ui/ngb-crm-web
        run: npm ci --workspaces=false

      - name: Build CRM UI
        working-directory: ui/ngb-crm-web
        run: npm run build --workspaces=false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore CRM backend from nuget.org
        run: |
          dotnet restore NGB.CRM.Api/NGB.CRM.Api.csproj --configfile NuGet.Registry.Config
          dotnet restore NGB.CRM.BackgroundJobs/NGB.CRM.BackgroundJobs.csproj --configfile NuGet.Registry.Config
          dotnet restore NGB.CRM.Watchdog/NGB.CRM.Watchdog.csproj --configfile NuGet.Registry.Config
          dotnet restore NGB.CRM.Migrator/NGB.CRM.Migrator.csproj --configfile NuGet.Registry.Config

  build-platform:
    name: build ${{ matrix.image }}
    needs:
      - release-source
      - crm-registry-dependencies
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ngb-pm-api
            context: .
            dockerfile: ./NGB.PropertyManagement.Api/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
          - image: ngb-pm-backgroundjobs
            context: .
            dockerfile: ./NGB.PropertyManagement.BackgroundJobs/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
          - image: ngb-pm-watchdog
            context: .
            dockerfile: ./NGB.PropertyManagement.Watchdog/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
          - image: ngb-pm-migrator
            context: .
            dockerfile: ./NGB.PropertyManagement.Migrator/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
          - image: ngb-pm-web
            context: ./ui
            dockerfile: ./ui/ngb-property-management-web/Dockerfile
            build_args: ""
          - image: ngb-trade-api
            context: .
            dockerfile: ./NGB.Trade.Api/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
          - image: ngb-trade-backgroundjobs
            context: .
            dockerfile: ./NGB.Trade.BackgroundJobs/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
          - image: ngb-trade-watchdog
            context: .
            dockerfile: ./NGB.Trade.Watchdog/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
          - image: ngb-trade-migrator
            context: .
            dockerfile: ./NGB.Trade.Migrator/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
          - image: ngb-trade-web
            context: ./ui
            dockerfile: ./ui/ngb-trade-web/Dockerfile
            build_args: ""
          - image: ngb-ab-api
            context: .
            dockerfile: ./NGB.AgencyBilling.Api/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
          - image: ngb-ab-backgroundjobs
            context: .
            dockerfile: ./NGB.AgencyBilling.BackgroundJobs/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
          - image: ngb-ab-watchdog
            context: .
            dockerfile: ./NGB.AgencyBilling.Watchdog/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
          - image: ngb-ab-migrator
            context: .
            dockerfile: ./NGB.AgencyBilling.Migrator/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
          - image: ngb-ab-web
            context: ./ui
            dockerfile: ./ui/ngb-agency-billing-web/Dockerfile
            build_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-source.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:sha-${{ needs.release-source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-source.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  build-crm:
    name: build ${{ matrix.image }}
    needs:
      - release-source
      - crm-registry-dependencies
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ngb-crm-api
            context: .
            dockerfile: ./NGB.CRM.Api/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
              NUGET_CONFIG=NuGet.Registry.Config
          - image: ngb-crm-backgroundjobs
            context: .
            dockerfile: ./NGB.CRM.BackgroundJobs/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
              NUGET_CONFIG=NuGet.Registry.Config
          - image: ngb-crm-watchdog
            context: .
            dockerfile: ./NGB.CRM.Watchdog/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
              NUGET_CONFIG=NuGet.Registry.Config
          - image: ngb-crm-migrator
            context: .
            dockerfile: ./NGB.CRM.Migrator/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
              NUGET_CONFIG=NuGet.Registry.Config
          - image: ngb-crm-web
            context: .
            dockerfile: ./ui/ngb-crm-web/Dockerfile
            build_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-source.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:sha-${{ needs.release-source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-source.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  propose-infra-deploy:
    name: propose infra deploy
    needs:
      - release-source
      - build-platform
      - build-crm
    if: >-
      ${{
        needs.build-platform.result == 'success' &&
        needs.build-crm.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INFRA_REPOSITORY: ngbplatform/ngb-platform-infra
      NGB_SOURCE_SHA: ${{ needs.release-source.outputs.sha }}
      IMAGE_TAG: sha-${{ needs.release-source.outputs.sha }}
      PLATFORM_BUILD_RESULT: ${{ needs.build-platform.result }}
      CRM_BUILD_RESULT: ${{ needs.build-crm.result }}

    steps:
      - name: Validate deploy PR credentials
        env:
          INFRA_PR_TOKEN: ${{ secrets.NGB_PLATFORM_INFRA_PR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${INFRA_PR_TOKEN}" ]; then
            echo "::error::Configure NGB_PLATFORM_INFRA_PR_TOKEN repository secret."
            exit 1
          fi

      - name: Checkout infra repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          token: ${{ secrets.NGB_PLATFORM_INFRA_PR_TOKEN }}
          path: ngb-platform-infra

      - name: Update platform workload image tags
        id: update
        working-directory: ngb-platform-infra
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["IMAGE_TAG"]
          workloads = []
          if os.environ["PLATFORM_BUILD_RESULT"] == "success":
              workloads.extend(("pm", "trade", "ab"))
          if os.environ["CRM_BUILD_RESULT"] == "success":
              workloads.append("crm")

          if not workloads:
              raise SystemExit("No successfully built workloads to deploy")

          pattern = re.compile(r"(?m)^(\s*imageTag:\s*&imageTag\s+).+$")
          updated_paths = []

          for workload in workloads:
              path = Path(f"apps/{workload}/envs/prod/values.yaml")
              if not path.exists():
                  raise SystemExit(f"Missing infra values file: {path}")
              text = path.read_text(encoding="utf-8")
              updated, count = pattern.subn(lambda match: match.group(1) + tag, text, count=1)
              if count != 1:
                  raise SystemExit(f"Could not update imageTag in {path}")
              path.write_text(updated, encoding="utf-8")
              updated_paths.append(path)

          Path(".ngb-updated-files").write_text(
              "\n".join(str(path) for path in updated_paths) + "\n",
              encoding="utf-8",
          )

          labels = {"pm": "PM", "trade": "Trade", "ab": "AB", "crm": "CRM"}
          names = [labels[workload] for workload in workloads]
          if len(names) == 1:
              workloads_label = names[0]
          elif len(names) == 2:
              workloads_label = f"{names[0]} and {names[1]}"
          else:
              workloads_label = f"{', '.join(names[:-1])}, and {names[-1]}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"workloads={','.join(workloads)}\n")
              output.write(f"workloads_label={workloads_label}\n")
          PY

          if git diff --quiet -- $(cat .ngb-updated-files); then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open infra deploy PR
        if: steps.update.outputs.changed == 'true'
        working-directory: ngb-platform-infra
        env:
          GH_TOKEN: ${{ secrets.NGB_PLATFORM_INFRA_PR_TOKEN }}
        run: |
          set -euo pipefail

          branch="deploy/ngb-${NGB_SOURCE_SHA}"
          title="Deploy NGB ${IMAGE_TAG}"
          body="$(mktemp)"
          remote_sha="$(git ls-remote --heads origin "refs/heads/${branch}" | awk 'NR == 1 { print $1 }')"
          cat > "${body}" <<EOF
          Automated deployment proposal after a successful NGB container image build.

          Source repository: https://github.com/ngbplatform/NGB
          Source commit: ${NGB_SOURCE_SHA}
          Image tag: ${IMAGE_TAG}

          This PR updates ${{ steps.update.outputs.workloads_label }} production image tags in ngb-platform-infra.
          Merge it to let Argo CD deploy. The selected workload PreSync migrator hooks run before workload rollout.
          EOF

          git config user.name "ngb-deploy-bot"
          git config user.email "ngb-deploy-bot@users.noreply.github.com"
          git checkout -B "${branch}"
          git add $(cat .ngb-updated-files)
          git commit -m "Deploy NGB ${IMAGE_TAG}"
          if [ -n "${remote_sha}" ]; then
            git push \
              --force-with-lease="refs/heads/${branch}:${remote_sha}" \
              origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi

          pr_number="$(gh pr list \
            --repo "${INFRA_REPOSITORY}" \
            --head "${branch}" \
            --state all \
            --json number,state \
            --jq 'map(select(.state != "MERGED")) | .[0].number // empty')"
          if [ -n "${pr_number}" ]; then
            pr_state="$(gh pr view "${pr_number}" --repo "${INFRA_REPOSITORY}" --json state --jq '.state')"
            if [ "${pr_state}" = "CLOSED" ]; then
              gh pr reopen "${pr_number}" --repo "${INFRA_REPOSITORY}"
            fi
            gh pr edit "${pr_number}" --repo "${INFRA_REPOSITORY}" --title "${title}" --body-file "${body}"
          else
            gh pr create --repo "${INFRA_REPOSITORY}" --base main --head "${branch}" --title "${title}" --body-file "${body}"
          fi
