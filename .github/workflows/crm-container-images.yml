name: crm-container-images

on:
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - '.github/workflows/crm-container-images.yml'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'NuGet.Registry.Config'
      - 'NGB.CRM*/**'
      - 'ui/ngb-crm-web/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: crm-container-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ngbplatform
  BUILD_CONFIGURATION: Release

jobs:
  registry-dependencies:
    name: verify published dependencies
    if: github.event_name == 'workflow_dispatch' || vars.NGB_CRM_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ui/ngb-crm-web/package-lock.json

      - name: Restore CRM UI from npm
        working-directory: ui/ngb-crm-web
        run: npm ci

      - name: Build CRM UI
        working-directory: ui/ngb-crm-web
        run: npm run build

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore CRM backend from nuget.org
        run: dotnet restore NGB.CRM.Api/NGB.CRM.Api.csproj --configfile NuGet.Registry.Config

  build:
    name: build ${{ matrix.image }}
    needs: registry-dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ngb-crm-api
            context: .
            dockerfile: ./NGB.CRM.Api/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
              NUGET_CONFIG=NuGet.Registry.Config
          - image: ngb-crm-backgroundjobs
            context: .
            dockerfile: ./NGB.CRM.BackgroundJobs/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
              NUGET_CONFIG=NuGet.Registry.Config
          - image: ngb-crm-watchdog
            context: .
            dockerfile: ./NGB.CRM.Watchdog/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
              NUGET_CONFIG=NuGet.Registry.Config
          - image: ngb-crm-migrator
            context: .
            dockerfile: ./NGB.CRM.Migrator/Dockerfile
            build_args: |
              BUILD_CONFIGURATION=Release
              NUGET_CONFIG=NuGet.Registry.Config
          - image: ngb-crm-web
            context: .
            dockerfile: ./ui/ngb-crm-web/Dockerfile
            build_args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
