name: publish-platform-nuget

on:
  workflow_dispatch:
    inputs:
      certification_run_id:
        description: Publish the complete certified NuGet/npm release from this successful main-branch run
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish-certified-release:
    uses: ./.github/workflows/publish-platform-release.yml
    with:
      certification_run_id: ${{ inputs.certification_run_id }}
    secrets: inherit
