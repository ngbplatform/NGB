name: platform-packages

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'LICENSE'
      - 'NOTICE'
      - 'NGB.Accounting/**'
      - 'NGB.AiAssistant*/**'
      - 'NGB.Mcp*/**'
      - 'NGB.Api/**'
      - 'NGB.Attachments/**'
      - 'NGB.Notes/**'
      - 'NGB.Attachments.MinIO/**'
      - 'NGB.Hosting.AspNetCore/**'
      - 'NGB.Application.Abstractions/**'
      - 'NGB.BackgroundJobs/**'
      - 'NGB.BackgroundJobs.PostgreSql/**'
      - 'NGB.Contracts/**'
      - 'NGB.Core/**'
      - 'NGB.Definitions/**'
      - 'NGB.Metadata/**'
      - 'NGB.Migrator.Core/**'
      - 'NGB.OperationalRegisters/**'
      - 'NGB.Persistence/**'
      - 'NGB.PostgreSql/**'
      - 'NGB.PostgreSql.AspNetCore/**'
      - 'NGB.ReferenceRegisters/**'
      - 'NGB.Runtime/**'
      - 'NGB.Runtime.Hosting/**'
      - 'NGB.Tools/**'
      - 'NGB.Watchdog/**'
      - 'packaging/**'
      - 'ai-devkit/**'
      - 'quality/ai-devkit/**'
      - 'quality/external-consumer/**'
      - 'quality/package.json'
      - 'quality/package-lock.json'
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - 'ui/ngb-crm-web/package.json'
      - 'ui/ngb-crm-web/package-lock.json'
      - 'ui/ngb-ui-framework/**'
      - 'ui/scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'LICENSE'
      - 'NOTICE'
      - 'NGB.Accounting/**'
      - 'NGB.AiAssistant*/**'
      - 'NGB.Mcp*/**'
      - 'NGB.Api/**'
      - 'NGB.Attachments/**'
      - 'NGB.Notes/**'
      - 'NGB.Attachments.MinIO/**'
      - 'NGB.Hosting.AspNetCore/**'
      - 'NGB.Application.Abstractions/**'
      - 'NGB.BackgroundJobs/**'
      - 'NGB.BackgroundJobs.PostgreSql/**'
      - 'NGB.Contracts/**'
      - 'NGB.Core/**'
      - 'NGB.Definitions/**'
      - 'NGB.Metadata/**'
      - 'NGB.Migrator.Core/**'
      - 'NGB.OperationalRegisters/**'
      - 'NGB.Persistence/**'
      - 'NGB.PostgreSql/**'
      - 'NGB.PostgreSql.AspNetCore/**'
      - 'NGB.ReferenceRegisters/**'
      - 'NGB.Runtime/**'
      - 'NGB.Runtime.Hosting/**'
      - 'NGB.Tools/**'
      - 'NGB.Watchdog/**'
      - 'packaging/**'
      - 'ai-devkit/**'
      - 'quality/ai-devkit/**'
      - 'quality/external-consumer/**'
      - 'quality/package.json'
      - 'quality/package-lock.json'
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - 'ui/ngb-crm-web/package.json'
      - 'ui/ngb-crm-web/package-lock.json'
      - 'ui/ngb-ui-framework/**'
      - 'ui/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    name: validate @ngbplatform/ui
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.npm-artifact.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install UI workspace
        working-directory: ui
        run: npm ci

      - name: Resolve package version
        id: npm-version
        working-directory: ui
        run: |
          version="$(node -p 'require("./ngb-ui-framework/package.json").version')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Pack scoped public package
        working-directory: ui
        run: npm run pack:platform-ui

      - name: Upload npm package
        id: npm-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ngbplatform-ui-${{ steps.npm-version.outputs.version }}-attempt-${{ github.run_attempt }}
          path: artifacts/npm/ngbplatform-ui-${{ steps.npm-version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 14

  nuget:
    name: validate NGB.Platform NuGet packages
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401

      - name: Download the built npm package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.npm.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts/npm

      - name: Pack platform packages
        run: |
          npm --prefix quality ci
          bash packaging/nuget/pack-platform.sh

      - name: Resolve package version
        id: nuget-version
        run: echo "version=$(dotnet msbuild NGB.Tools/NGB.Tools.csproj -nologo -getProperty:PackageVersion)" >> "${GITHUB_OUTPUT}"

      - name: Verify NuGet package set
        run: bash packaging/nuget/verify-platform-packages.sh

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: ngb-platform-nuget-${{ steps.nuget-version.outputs.version }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/nuget-release/*.nupkg
            artifacts/nuget-release/*.snupkg
          if-no-files-found: error
          retention-days: 14

      - name: Record the GitHub build package identities
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node quality/external-consumer/build-release.mjs seal

      - name: Upload the GitHub release package set
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ngb-platform-release-attempt-${{ github.run_attempt }}
          path: artifacts/release-candidate/
          if-no-files-found: error
          retention-days: 30
