name: platform-packages

on:
  pull_request:
    paths:
      - '.github/workflows/platform-packages.yml'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'LICENSE'
      - 'NOTICE'
      - 'NGB.Accounting/**'
      - 'NGB.Api/**'
      - 'NGB.Application.Abstractions/**'
      - 'NGB.BackgroundJobs/**'
      - 'NGB.Contracts/**'
      - 'NGB.Core/**'
      - 'NGB.Definitions/**'
      - 'NGB.Metadata/**'
      - 'NGB.Migrator.Core/**'
      - 'NGB.OperationalRegisters/**'
      - 'NGB.Persistence/**'
      - 'NGB.PostgreSql/**'
      - 'NGB.ReferenceRegisters/**'
      - 'NGB.Runtime/**'
      - 'NGB.Tools/**'
      - 'NGB.Watchdog/**'
      - 'packaging/**'
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - 'ui/ngb-crm-web/package.json'
      - 'ui/ngb-crm-web/package-lock.json'
      - 'ui/ngb-ui-framework/**'
      - 'ui/scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform-packages.yml'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'LICENSE'
      - 'NOTICE'
      - 'NGB.Accounting/**'
      - 'NGB.Api/**'
      - 'NGB.Application.Abstractions/**'
      - 'NGB.BackgroundJobs/**'
      - 'NGB.Contracts/**'
      - 'NGB.Core/**'
      - 'NGB.Definitions/**'
      - 'NGB.Metadata/**'
      - 'NGB.Migrator.Core/**'
      - 'NGB.OperationalRegisters/**'
      - 'NGB.Persistence/**'
      - 'NGB.PostgreSql/**'
      - 'NGB.ReferenceRegisters/**'
      - 'NGB.Runtime/**'
      - 'NGB.Tools/**'
      - 'NGB.Watchdog/**'
      - 'packaging/**'
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - 'ui/ngb-crm-web/package.json'
      - 'ui/ngb-crm-web/package-lock.json'
      - 'ui/ngb-ui-framework/**'
      - 'ui/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    name: validate @ngbplatform/ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install UI workspace
        working-directory: ui
        run: npm ci

      - name: Test UI framework
        working-directory: ui
        run: |
          npm run test:api-compat
          npm exec -- vitest run --config ngb-ui-framework/vitest.config.ts

      - name: Resolve package version
        id: npm-version
        working-directory: ui
        run: |
          version="$(node -p 'require("./ngb-ui-framework/package.json").version')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Pack scoped public package
        working-directory: ui
        run: npm run pack:platform-ui

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: ngbplatform-ui-${{ steps.npm-version.outputs.version }}
          path: artifacts/npm/ngbplatform-ui-${{ steps.npm-version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 14

  nuget:
    name: validate NGB.Platform NuGet packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Pack platform packages
        run: bash packaging/nuget/pack-platform.sh

      - name: Resolve package version
        id: nuget-version
        run: echo "version=$(dotnet msbuild NGB.Tools/NGB.Tools.csproj -nologo -getProperty:PackageVersion)" >> "${GITHUB_OUTPUT}"

      - name: Verify NuGet package set
        run: bash packaging/nuget/verify-platform-packages.sh

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: ngb-platform-nuget-${{ steps.nuget-version.outputs.version }}
          path: |
            artifacts/nuget-release/*.nupkg
            artifacts/nuget-release/*.snupkg
          if-no-files-found: error
          retention-days: 14
